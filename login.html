<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - JobsPerHourBerlin.de</title>
<link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* Your existing CSS remains the same */
  body { font-family: 'Poppins', sans-serif; background: #f4f4f4; margin: 0; padding: 0; color: #232d39; }
  .login-container { max-width: 450px; margin: 60px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1);}
  .login-container h2 { text-align: center; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: 500; }
  input { width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
  .password-input-container { position: relative; }
  .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #777; cursor: pointer; font-size: 16px; }
  .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
  .remember-me input { margin-right: 8px; }
  .forgot-password { color: #ed563b; cursor: pointer; }
  button { width: 100%; padding: 14px; background: #ed563b; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; display: flex; justify-content: center; align-items: center; }
  button:hover { background-color: #f9735b; }
  .button-loader { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider { display: flex; align-items: center; margin: 25px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #ddd; }
  .divider span { padding: 0 15px; color: #777; font-size: 14px; }
  .social-login { display: flex; gap: 15px; margin-bottom: 25px; }
  .social-btn { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background-color 0.3s; font-size: 14px; font-weight: 500; }
  .social-btn:hover { background-color: #f9f9f9; }
  .social-btn i { margin-right: 8px; font-size: 18px; }
  .google-btn { color: #DB4437; border-color: #DB4437; }
  .facebook-btn { color: #4267B2; border-color: #4267B2; }
  .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 500; }
  .error-msg { background-color: rgba(211,47,47,0.1); color: #d32f2f; border: 1px solid rgba(211,47,47,0.2); }
  .success-msg { background-color: rgba(56,142,60,0.1); color: #388e3c; border: 1px solid rgba(56,142,60,0.2); }
  .warning-msg { background-color: rgba(255,152,0,0.1); color: #f57c00; border: 1px solid rgba(255,152,0,0.2); }
</style>
</head>
<body>

<div class="login-container">
  <h2>Login / Anmelden</h2>
  <div id="message"></div>
  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email / E-Mail-Adresse</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password / Passwort</label>
      <div class="password-input-container">
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <button type="button" class="toggle-password"><i class="far fa-eye"></i></button>
      </div>
    </div>
    <div class="remember-forgot">
      <div class="remember-me">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me / Angemeldet bleiben</label>
      </div>
      <span class="forgot-password">Forgot Password? / Passwort vergessen?</span>
    </div>
    <button type="submit" id="loginBtn">
      <span id="loginText">Login / Anmelden</span>
      <div id="loginLoader" class="button-loader" style="display: none;"></div>
    </button>
  </form>
  <div class="divider"><span>Or / Oder</span></div>
  <div class="social-login">
    <button class="social-btn google-btn" id="googleLogin"><i class="fab fa-google"></i> Google</button>
    <button class="social-btn facebook-btn" id="facebookLogin"><i class="fab fa-facebook-f"></i> Facebook</button>
  </div>
  <a href="signup.html" class="signup-link">Don't have an account? Sign Up / Noch kein Konto? Registrieren</a>
</div>

<!-- Forgot Password Modal -->
<div id="forgotModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
  <div style="background:#fff;padding:30px;border-radius:12px;width:90%;max-width:450px;position:relative;">
    <span class="close" style="position:absolute;right:15px;top:10px;font-size:28px;cursor:pointer;">&times;</span>
    <h3>Reset Password / Passwort zurücksetzen</h3>
    <input type="email" id="resetEmail" placeholder="Enter your email / E-Mail-Adresse" style="width:100%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:8px;">
    <button id="resetBtn">Send Reset Email / E-Mail senden</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  GoogleAuthProvider, 
  FacebookAuthProvider, 
  signInWithPopup, 
  sendPasswordResetEmail, 
  setPersistence, 
  browserLocalPersistence, 
  browserSessionPersistence 
} from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

// Replace with your actual Firebase config or keep the import if file exists
const firebaseConfig = {
  apiKey: "your-api-key",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project-id",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "123456789",
  appId: "your-app-id"
};

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const googleProvider = new GoogleAuthProvider();
  const facebookProvider = new FacebookAuthProvider();

  // Add scopes if needed
  googleProvider.addScope('email');
  googleProvider.addScope('profile');
  facebookProvider.addScope('email');

  const loginForm = document.getElementById("loginForm");
  const messageDiv = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");
  const loginText = document.getElementById("loginText");
  const loginLoader = document.getElementById("loginLoader");
  const togglePasswordBtn = document.querySelector(".toggle-password");
  const passwordInput = document.getElementById("password");
  const googleLoginBtn = document.getElementById("googleLogin");
  const facebookLoginBtn = document.getElementById("facebookLogin");
  const rememberCheckbox = document.getElementById("remember");

  // Forgot password modal
  const modal = document.getElementById("forgotModal");
  const closeBtn = modal.querySelector(".close");
  const resetEmailInput = document.getElementById("resetEmail");
  const resetBtn = document.getElementById("resetBtn");

  function showMessage(msg, type = 'error') { 
    messageDiv.innerHTML = `<div class="message ${type}-msg">${msg}</div>`; 
    if(type === 'success') setTimeout(() => { messageDiv.innerHTML = ''; }, 5000); 
  }

  function setLoading(isLoading) { 
    loginBtn.disabled = isLoading; 
    loginText.style.display = isLoading ? 'none' : 'block'; 
    loginLoader.style.display = isLoading ? 'block' : 'none'; 
  }

  // Toggle password visibility
  togglePasswordBtn.addEventListener("click", () => { 
    const type = passwordInput.type === 'password' ? 'text' : 'password'; 
    passwordInput.type = type; 
    togglePasswordBtn.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>'; 
  });

  // Email/Password login
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = loginForm.email.value.trim();
    const password = loginForm.password.value;
    const rememberMe = rememberCheckbox.checked;
    
    if(!email || !password) { 
      showMessage("Please fill all fields / Bitte alle Felder ausfüllen"); 
      return; 
    }
    
    setLoading(true);
    try {
      await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      
      if(!userCredential.user.emailVerified) { 
        showMessage("Please verify your email / Bitte E-Mail verifizieren", "warning"); 
      } else { 
        showMessage("Login successful! Redirecting... / Anmeldung erfolgreich!", "success"); 
        setTimeout(() => window.location.href = "index.html", 1500); 
      }
    } catch(err) { 
      // More specific error messages
      let errorMessage = err.message;
      if (err.code === 'auth/invalid-email') {
        errorMessage = "Invalid email address / Ungültige E-Mail-Adresse";
      } else if (err.code === 'auth/user-not-found') {
        errorMessage = "User not found / Benutzer nicht gefunden";
      } else if (err.code === 'auth/wrong-password') {
        errorMessage = "Wrong password / Falsches Passwort";
      } else if (err.code === 'auth/too-many-requests') {
        errorMessage = "Too many attempts. Try again later / Zu viele Versuche. Bitte später erneut versuchen";
      }
      showMessage(errorMessage); 
    } finally { 
      setLoading(false); 
    }
  });

  // Google login with better error handling
  googleLoginBtn.addEventListener("click", async () => {
    try {
      googleLoginBtn.disabled = true;
      googleLoginBtn.innerHTML = '<i class="fab fa-google"></i> Connecting...';
      
      const result = await signInWithPopup(auth, googleProvider);
      showMessage("Google login successful! Redirecting...", "success");
      setTimeout(() => window.location.href = "index.html", 1500);
    } catch(err) { 
      let errorMessage = err.message;
      
      // Handle specific OAuth errors
      if (err.code === 'auth/popup-blocked') {
        errorMessage = "Popup blocked. Please allow popups for this site / Popup blockiert. Bitte Popups erlauben";
      } else if (err.code === 'auth/popup-closed-by-user') {
        errorMessage = "Login cancelled / Anmeldung abgebrochen";
      } else if (err.code === 'auth/unauthorized-domain') {
        errorMessage = "Domain not authorized. Check Firebase console settings / Domain nicht autorisiert. Firebase Einstellungen prüfen";
      } else if (err.code === 'auth/operation-not-allowed') {
        errorMessage = "Google login not enabled. Check Firebase Auth settings / Google Login nicht aktiviert. Firebase Einstellungen prüfen";
      }
      
      showMessage(errorMessage); 
    } finally { 
      googleLoginBtn.disabled = false;
      googleLoginBtn.innerHTML = '<i class="fab fa-google"></i> Google';
    }
  });

  // Facebook login with better error handling
  facebookLoginBtn.addEventListener("click", async () => {
    try {
      facebookLoginBtn.disabled = true;
      facebookLoginBtn.innerHTML = '<i class="fab fa-facebook-f"></i> Connecting...';
      
      const result = await signInWithPopup(auth, facebookProvider);
      showMessage("Facebook login successful! Redirecting...", "success");
      setTimeout(() => window.location.href = "index.html", 1500);
    } catch(err) { 
      let errorMessage = err.message;
      
      if (err.code === 'auth/popup-blocked') {
        errorMessage = "Popup blocked. Please allow popups for this site / Popup blockiert. Bitte Popups erlauben";
      } else if (err.code === 'auth/popup-closed-by-user') {
        errorMessage = "Login cancelled / Anmeldung abgebrochen";
      } else if (err.code === 'auth/unauthorized-domain') {
        errorMessage = "Domain not authorized. Check Firebase console settings / Domain nicht autorisiert. Firebase Einstellungen prüfen";
      } else if (err.code === 'auth/operation-not-allowed') {
        errorMessage = "Facebook login not enabled. Check Firebase Auth settings / Facebook Login nicht aktiviert. Firebase Einstellungen prüfen";
      } else if (err.code === 'auth/account-exists-with-different-credential') {
        errorMessage = "Account exists with different credential / Konto existiert mit anderen Anmeldedaten";
      }
      
      showMessage(errorMessage); 
    } finally { 
      facebookLoginBtn.disabled = false;
      facebookLoginBtn.innerHTML = '<i class="fab fa-facebook-f"></i> Facebook';
    }
  });

  // Forgot password modal
  document.querySelector(".forgot-password").addEventListener("click", () => { 
    modal.style.display = "flex"; 
    resetEmailInput.focus(); 
  });
  
  closeBtn.addEventListener("click", () => { 
    modal.style.display = "none"; 
    resetEmailInput.value = ''; 
  });
  
  window.addEventListener("click", (e) => { 
    if(e.target == modal) { 
      modal.style.display = "none"; 
      resetEmailInput.value = ''; 
    } 
  });
  
  resetBtn.addEventListener("click", async () => {
    const email = resetEmailInput.value.trim();
    if(!email) { 
      showMessage("Enter email / Bitte E-Mail eingeben"); 
      return; 
    }
    try { 
      await sendPasswordResetEmail(auth, email); 
      showMessage("Reset email sent / E-Mail gesendet", "success"); 
      modal.style.display = "none"; 
    } catch(err) { 
      showMessage(err.message); 
    }
  });

} catch (error) {
  console.error('Firebase initialization error:', error);
  showMessage('Firebase initialization failed. Please check configuration.', 'error');
}
</script>

</body>
</html>
