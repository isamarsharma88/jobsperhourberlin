<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JobsPerHourBerlin.de</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .login-container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #232d39;
    }

    .login-container label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .login-container input[type="email"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #ed563b;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 600;
      transition: 0.3s;
    }

    .login-container button:hover {
      background-color: #f9735b;
    }

    .login-container a {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #ed563b;
      text-decoration: none;
      cursor: pointer;
    }

    .login-container a:hover {
      text-decoration: underline;
    }

    .error-msg {
      color: red;
      text-align: center;
      margin-bottom: 15px;
    }

    .success-msg {
      color: green;
      text-align: center;
      margin-bottom: 15px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 30px;
      border: 1px solid #888;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      text-align: center;
    }

    .modal-content input[type="email"] {
      margin-bottom: 15px;
    }

    .modal-content button {
      margin-top: 10px;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login / Anmelden</h2>
    <div id="message"></div>
    <form id="loginForm">
      <label for="email">Email / E-Mail-Adresse</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password / Passwort</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Login / Anmelden</button>

      <a class="forgot-password">Forgot Password? / Passwort vergessen?</a>
      <a href="signup.html">Don’t have an account? Sign Up</a>
    </form>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Reset Password / Passwort zurücksetzen</h3>
      <input type="email" id="resetEmail" placeholder="Enter your email / E-Mail-Adresse eingeben">
      <button id="resetBtn">Send Reset Email / E-Mail senden</button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNF0tg_Jrt-8iL8Azx2rY8zCVdaJU2l9g",
      authDomain: "job-board-da315.firebaseapp.com",
      projectId: "job-board-da315",
      storageBucket: "job-board-da315.firebasestorage.app",
      messagingSenderId: "908048807079",
      appId: "1:908048807079:web:58f70af2e706f27684d782",
      measurementId: "G-FHYPY906DE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const messageDiv = document.getElementById("message");
    const forgotLink = document.querySelector(".forgot-password");

    // Modal Elements
    const modal = document.getElementById("forgotModal");
    const closeBtn = document.querySelector(".close");
    const resetEmailInput = document.getElementById("resetEmail");
    const resetBtn = document.getElementById("resetBtn");

    // LOGIN FUNCTION
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = loginForm.email.value;
      const password = loginForm.password.value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          if (!user.emailVerified) {
            messageDiv.innerHTML = `<p class="error-msg">Please verify your email before logging in / Bitte bestätigen Sie Ihre E-Mail-Adresse.</p>`;
          } else {
            messageDiv.innerHTML = '<p class="success-msg">Login successful! Redirecting...</p>';
            setTimeout(() => window.location.href = "index.html", 1500);
          }
        })
        .catch((error) => {
          let errorMessage = "";
          if (error.code === "auth/user-not-found") 
            errorMessage = "User not found / Benutzer nicht gefunden";
          else if (error.code === "auth/wrong-password") 
            errorMessage = "Incorrect password / Falsches Passwort";
          else 
            errorMessage = error.message;
          messageDiv.innerHTML = `<p class="error-msg">${errorMessage}</p>`;
        });
    });

    // OPEN MODAL
    forgotLink.addEventListener("click", () => {
      modal.style.display = "block";
    });

    // CLOSE MODAL
    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
      resetEmailInput.value = "";
    });

    window.addEventListener("click", (e) => {
      if (e.target == modal) {
        modal.style.display = "none";
        resetEmailInput.value = "";
      }
    });

    // RESET PASSWORD
    resetBtn.addEventListener("click", () => {
      const email = resetEmailInput.value.trim();
      if (!email) {
        alert("Please enter your email / Bitte geben Sie Ihre E-Mail-Adresse ein");
        return;
      }
      sendPasswordResetEmail(auth, email)
        .then(() => {
          alert("Password reset email sent! Check your inbox / Passwort zurücksetzen E-Mail wurde gesendet!");
          modal.style.display = "none";
          resetEmailInput.value = "";
        })
        .catch((error) => {
          alert("Error: " + error.message);
        });
    });
  </script>

</body>
</html>
