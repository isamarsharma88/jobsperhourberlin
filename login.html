<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - JobsPerHourBerlin.de</title>
<link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body { 
    font-family: 'Poppins', sans-serif; 
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    margin: 0; 
    padding: 0; 
    color: #232d39; 
    min-height: 100vh;
  }

  .header-banner {
    background: linear-gradient(135deg, #ed563b 0%, #f9735b 100%);
    color: white;
    padding: 25px 0;
    box-shadow: 0 4px 20px rgba(237, 86, 59, 0.3);
    position: relative;
    overflow: hidden;
  }

  .banner-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .logo-section {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .logo-icon {
    width: 50px;
    height: 50px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .logo-icon i {
    font-size: 24px;
    color: white;
  }

  .logo-text h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
    line-height: 1.2;
  }

  .logo-text .tagline {
    font-size: 14px;
    font-weight: 300;
    opacity: 0.9;
    margin-top: 4px;
  }

  .main-container {
    display: flex;
    min-height: calc(100vh - 120px);
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .login-container { 
    max-width: 450px; 
    width: 100%;
    background: #fff; 
    padding: 40px; 
    border-radius: 20px; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .login-container h2 { 
    text-align: center; 
    margin-bottom: 30px; 
    color: #232d39;
    font-weight: 600;
  }

  .form-group { 
    margin-bottom: 20px; 
  }

  label { 
    display: block; 
    margin-bottom: 8px; 
    font-weight: 500; 
    color: #232d39;
  }

  input { 
    width: 100%; 
    padding: 14px 16px; 
    border: 2px solid #e9ecef; 
    border-radius: 10px; 
    font-size: 16px; 
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
  }

  input:focus {
    outline: none;
    border-color: #ed563b;
    box-shadow: 0 0 0 3px rgba(237, 86, 59, 0.1);
  }

  .password-input-container { 
    position: relative; 
  }

  .toggle-password { 
    position: absolute; 
    right: 12px; 
    top: 50%; 
    transform: translateY(-50%); 
    background: none; 
    border: none; 
    color: #777; 
    cursor: pointer; 
    font-size: 16px; 
    padding: 5px;
  }

  .remember-forgot { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 20px; 
    font-size: 14px; 
  }

  .remember-me { 
    display: flex; 
    align-items: center;
    gap: 8px;
  }

  .remember-me input { 
    width: auto;
    margin: 0;
  }

  .forgot-password { 
    color: #ed563b; 
    cursor: pointer; 
    font-weight: 500;
    transition: color 0.3s ease;
  }

  .forgot-password:hover {
    color: #f9735b;
  }

  button { 
    width: 100%; 
    padding: 16px; 
    background: #ed563b; 
    color: #fff; 
    border: none; 
    border-radius: 10px; 
    font-size: 16px; 
    cursor: pointer; 
    font-weight: 600; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
  }

  button:hover { 
    background-color: #f9735b; 
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(237, 86, 59, 0.3);
  }

  .button-loader { 
    display: inline-block; 
    width: 20px; 
    height: 20px; 
    border: 3px solid rgba(255,255,255,0.3); 
    border-radius: 50%; 
    border-top-color: #fff; 
    animation: spin 1s ease-in-out infinite; 
    margin-right: 10px; 
  }

  @keyframes spin { 
    to { transform: rotate(360deg); } 
  }

  .divider { 
    display: flex; 
    align-items: center; 
    margin: 25px 0; 
  }

  .divider::before, .divider::after { 
    content: ""; 
    flex: 1; 
    border-bottom: 1px solid #e9ecef; 
  }

  .divider span { 
    padding: 0 15px; 
    color: #777; 
    font-size: 14px; 
  }

  .social-login { 
    display: flex; 
    gap: 15px; 
    margin-bottom: 25px; 
  }

  .social-btn { 
    flex: 1; 
    padding: 14px; 
    border: 2px solid #e9ecef; 
    border-radius: 10px; 
    background: #fff; 
    cursor: pointer; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    transition: all 0.3s ease; 
    font-size: 14px; 
    font-weight: 500; 
  }

  .social-btn:hover { 
    background-color: #f8f9fa; 
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .social-btn i { 
    margin-right: 8px; 
    font-size: 18px; 
  }

  .google-btn { 
    color: #DB4437; 
    border-color: #e9ecef; 
  }

  .google-btn:hover {
    border-color: #DB4437;
    background: rgba(219, 68, 55, 0.05);
  }

  .facebook-btn { 
    color: #4267B2; 
    border-color: #e9ecef; 
  }

  .facebook-btn:hover {
    border-color: #4267B2;
    background: rgba(66, 103, 178, 0.05);
  }

  .signup-link {
    text-align: center;
    display: block;
    color: #ed563b;
    text-decoration: none;
    font-weight: 500;
    margin-top: 20px;
    transition: color 0.3s ease;
  }

  .signup-link:hover {
    color: #f9735b;
  }

  .message { 
    padding: 12px 16px; 
    border-radius: 10px; 
    margin-bottom: 20px; 
    text-align: center; 
    font-weight: 500; 
  }

  .error-msg { 
    background-color: rgba(211,47,47,0.1); 
    color: #d32f2f; 
    border: 1px solid rgba(211,47,47,0.2); 
  }

  .success-msg { 
    background-color: rgba(56,142,60,0.1); 
    color: #388e3c; 
    border: 1px solid rgba(56,142,60,0.2); 
  }

  .warning-msg { 
    background-color: rgba(255,152,0,0.1); 
    color: #f57c00; 
    border: 1px solid rgba(255,152,0,0.2); 
  }

  @media (max-width: 768px) {
    .banner-content {
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }

    .login-container {
      padding: 30px 25px;
      margin: 20px;
    }

    .social-login {
      flex-direction: column;
    }
  }

  @media (max-width: 480px) {
    .header-banner {
      padding: 20px 0;
    }

    .logo-text h1 {
      font-size: 24px;
    }

    .logo-text .tagline {
      font-size: 12px;
    }

    .login-container {
      padding: 25px 20px;
    }
  }
</style>
</head>
<body>

<header class="header-banner">
  <div class="banner-content">
    <div class="logo-section">
      <div class="logo-icon">
        <i class="fas fa-briefcase"></i>
      </div>
      <div class="logo-text">
        <h1>JobsPerHourBerlin</h1>
        <div class="tagline">Hourly Jobs in Berlin</div>
      </div>
    </div>
  </div>
</header>

<div class="main-container">
  <div class="login-container">
    <h2>Login / Anmelden</h2>
    <div id="message"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email / E-Mail-Adresse</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password / Passwort</label>
        <div class="password-input-container">
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <button type="button" class="toggle-password"><i class="far fa-eye"></i></button>
        </div>
      </div>
      <div class="remember-forgot">
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>
        <span class="forgot-password">Forgot Password?</span>
      </div>
      <button type="submit" id="loginBtn">
        <span id="loginText">Login / Anmelden</span>
        <div id="loginLoader" class="button-loader" style="display: none;"></div>
      </button>
    </form>
    <div class="divider"><span>Or / Oder</span></div>
    <div class="social-login">
      <button class="social-btn google-btn" id="googleLogin"><i class="fab fa-google"></i> Google</button>
      <button class="social-btn facebook-btn" id="facebookLogin"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>
    <a href="signup.html" class="signup-link">Don't have an account? Sign Up / Noch kein Konto? Registrieren</a>
  </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:1000;">
  <div style="background:#fff;padding:30px;border-radius:20px;width:90%;max-width:450px;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.2);">
    <span class="close" style="position:absolute;right:15px;top:10px;font-size:28px;cursor:pointer;color:#777;">&times;</span>
    <h3 style="margin-bottom:20px;color:#232d39;">Reset Password / Passwort zurücksetzen</h3>
    <input type="email" id="resetEmail" placeholder="Enter your email / E-Mail-Adresse" style="width:100%;padding:14px;margin-bottom:20px;border:2px solid #e9ecef;border-radius:10px;font-size:16px;">
    <button id="resetBtn" style="background:#ed563b;color:white;border:none;padding:14px;border-radius:10px;cursor:pointer;font-weight:600;transition:background 0.3s ease;">Send Reset Email / E-Mail senden</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  GoogleAuthProvider, 
  FacebookAuthProvider, 
  signInWithPopup, 
  sendPasswordResetEmail, 
  setPersistence, 
  browserLocalPersistence, 
  browserSessionPersistence 
} from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

// Firebase configuration - REPLACE WITH YOUR ACTUAL CONFIG FROM FIREBASE CONSOLE
const firebaseConfig = {
  apiKey: "your-actual-api-key-here",
  authDomain: "your-project-id.firebaseapp.com",
  projectId: "your-project-id",
  storageBucket: "your-project-id.appspot.com",
  messagingSenderId: "your-sender-id",
  appId: "your-app-id"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const googleProvider = new GoogleAuthProvider();
const facebookProvider = new FacebookAuthProvider();

// DOM elements
const loginForm = document.getElementById("loginForm");
const messageDiv = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const loginText = document.getElementById("loginText");
const loginLoader = document.getElementById("loginLoader");
const togglePasswordBtn = document.querySelector(".toggle-password");
const passwordInput = document.getElementById("password");
const googleLoginBtn = document.getElementById("googleLogin");
const facebookLoginBtn = document.getElementById("facebookLogin");
const rememberCheckbox = document.getElementById("remember");

// Forgot password modal
const modal = document.getElementById("forgotModal");
const closeBtn = modal.querySelector(".close");
const resetEmailInput = document.getElementById("resetEmail");
const resetBtn = document.getElementById("resetBtn");

function showMessage(msg, type = 'error') { 
  messageDiv.innerHTML = `<div class="message ${type}-msg">${msg}</div>`; 
  if(type === 'success') setTimeout(() => { messageDiv.innerHTML = ''; }, 5000); 
}

function setLoading(isLoading) { 
  loginBtn.disabled = isLoading; 
  loginText.style.display = isLoading ? 'none' : 'block'; 
  loginLoader.style.display = isLoading ? 'block' : 'none'; 
}

// Toggle password visibility
togglePasswordBtn.addEventListener("click", () => { 
  const type = passwordInput.type === 'password' ? 'text' : 'password'; 
  passwordInput.type = type; 
  togglePasswordBtn.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>'; 
});

// Email/Password login
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = loginForm.email.value.trim();
  const password = loginForm.password.value;
  const rememberMe = rememberCheckbox.checked;
  
  if(!email || !password) { 
    showMessage("Please fill all fields / Bitte alle Felder ausfüllen"); 
    return; 
  }
  
  setLoading(true);
  try {
    await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    
    if(!userCredential.user.emailVerified) { 
      showMessage("Please verify your email / Bitte E-Mail verifizieren", "warning"); 
    } else { 
      showMessage("Login successful! Redirecting... / Anmeldung erfolgreich!", "success"); 
      setTimeout(() => window.location.href = "index.html", 1500); 
    }
  } catch(err) { 
    let errorMessage = err.message;
    if (err.code === 'auth/invalid-email') {
      errorMessage = "Invalid email address / Ungültige E-Mail-Adresse";
    } else if (err.code === 'auth/user-not-found') {
      errorMessage = "User not found / Benutzer nicht gefunden";
    } else if (err.code === 'auth/wrong-password') {
      errorMessage = "Wrong password / Falsches Passwort";
    } else if (err.code === 'auth/too-many-requests') {
      errorMessage = "Too many attempts. Try again later / Zu viele Versuche. Bitte später erneut versuchen";
    }
    showMessage(errorMessage); 
  } finally { 
    setLoading(false); 
  }
});

// Google login
googleLoginBtn.addEventListener("click", async () => {
  try {
    googleLoginBtn.disabled = true;
    googleLoginBtn.innerHTML = '<i class="fab fa-google"></i> Connecting...';
    
    const result = await signInWithPopup(auth, googleProvider);
    showMessage("Google login successful! Redirecting...", "success");
    setTimeout(() => window.location.href = "index.html", 1500);
  } catch(err) { 
    let errorMessage = err.message;
    
    if (err.code === 'auth/popup-blocked') {
      errorMessage = "Popup blocked. Please allow popups for this site / Popup blockiert. Bitte Popups erlauben";
    } else if (err.code === 'auth/popup-closed-by-user') {
      errorMessage = "Login cancelled / Anmeldung abgebrochen";
    } else if (err.code === 'auth/unauthorized-domain') {
      errorMessage = "Domain not authorized. Check Firebase console settings / Domain nicht autorisiert. Firebase Einstellungen prüfen";
    } else if (err.code === 'auth/operation-not-allowed') {
      errorMessage = "Google login not enabled. Check Firebase Auth settings / Google Login nicht aktiviert. Firebase Einstellungen prüfen";
    }
    
    showMessage(errorMessage); 
  } finally { 
    googleLoginBtn.disabled = false;
    googleLoginBtn.innerHTML = '<i class="fab fa-google"></i> Google';
  }
});

// Facebook login
facebookLoginBtn.addEventListener("click", async () => {
  try {
    facebookLoginBtn.disabled = true;
    facebookLoginBtn.innerHTML = '<i class="fab fa-facebook-f"></i> Connecting...';
    
    const result = await signInWithPopup(auth, facebookProvider);
    showMessage("Facebook login successful! Redirecting...", "success");
    setTimeout(() => window.location.href = "index.html", 1500);
  } catch(err) { 
    let errorMessage = err.message;
    
    if (err.code === 'auth/popup-blocked') {
      errorMessage = "Popup blocked. Please allow popups for this site / Popup blockiert. Bitte Popups erlauben";
    } else if (err.code === 'auth/popup-closed-by-user') {
      errorMessage = "Login cancelled / Anmeldung abgebrochen";
    } else if (err.code === 'auth/unauthorized-domain') {
      errorMessage = "Domain not authorized. Check Firebase console settings / Domain nicht autorisiert. Firebase Einstellungen prüfen";
    } else if (err.code === 'auth/operation-not-allowed') {
      errorMessage = "Facebook login not enabled. Check Firebase Auth settings / Facebook Login nicht aktiviert. Firebase Einstellungen prüfen";
    } else if (err.code === 'auth/account-exists-with-different-credential') {
      errorMessage = "Account exists with different credential / Konto existiert mit anderen Anmeldedaten";
    }
    
    showMessage(errorMessage); 
  } finally { 
    facebookLoginBtn.disabled = false;
    facebookLoginBtn.innerHTML = '<i class="fab fa-facebook-f"></i> Facebook';
  }
});

// Forgot password modal
document.querySelector(".forgot-password").addEventListener("click", () => { 
  modal.style.display = "flex"; 
  resetEmailInput.focus(); 
});

closeBtn.addEventListener("click", () => { 
  modal.style.display = "none"; 
  resetEmailInput.value = ''; 
});

window.addEventListener("click", (e) => { 
  if(e.target == modal) { 
    modal.style.display = "none"; 
    resetEmailInput.value = ''; 
  } 
});

resetBtn.addEventListener("click", async () => {
  const email = resetEmailInput.value.trim();
  if(!email) { 
    showMessage("Enter email / Bitte E-Mail eingeben"); 
    return; 
  }
  try { 
    await sendPasswordResetEmail(auth, email); 
    showMessage("Reset email sent / E-Mail gesendet", "success"); 
    modal.style.display = "none"; 
  } catch(err) { 
    showMessage(err.message); 
  }
});
</script>
</body>
</html>
