<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Sign Up / Registrieren - JobsPerHourBerlin.de</title>

  <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="bootstrap.min.css" />
  <link rel="stylesheet" href="font-awesome.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body { font-family: 'Poppins', sans-serif; background:#f4f4f4; margin:0; padding:0; }
    .signup-section { padding: 100px 0; }
    form#signupForm { max-width:700px; margin:0 auto; background:#fff; padding:40px; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.1); }
    form#signupForm label { font-weight:500; margin-top:15px; display:block; color:#232d39; }
    form#signupForm input[type="text"], 
    form#signupForm input[type="email"], 
    form#signupForm input[type="password"], 
    form#signupForm input[type="url"] { 
      width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:5px; font-size:14px;
    }
    form#signupForm input[type="radio"] { margin-right:6px; }
    form#signupForm button { margin-top:25px; background:#ed563b; color:#fff; border:none; border-radius:5px; padding:12px; font-size:14px; font-weight:600; text-transform:uppercase; width:100%; cursor:pointer; transition:0.3s; }
    form#signupForm button:hover { background:#f9735b; }
    .hidden { display:none; }
    #thankYouMessage { display:none; text-align:center; background:#e8fff3; color:#1c6b43; padding:15px; border-radius:6px; margin-top:20px; font-weight:500; border:1px solid #b3e6ca; }
    #errorMessage { display:none; color:red; margin-top:15px; font-weight:500; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header-area header-sticky">
  <div class="container">
    <nav class="main-nav">
      <a href="index.html" class="logo">Jobs Per Hour<em> Berlin</em></a>
      <ul class="nav">
        <li><a href="index.html">Home / Startseite</a></li>
        <li><a href="jobs.html">Jobs</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html" class="active">Sign Up</a></li>
        <li><a href="contact.html">Contact</a></li> 
      </ul>
      <a class='menu-trigger'><span>Menu</span></a>
    </nav>
  </div>
</header>

<!-- BANNER -->
<section class="section section-bg" id="call-to-action" style="background-image: url(banner-image-1-1920x500.jpg)">
  <div class="container">
    <div class="cta-content">
      <br><br>
    </div>
  </div>
</section>

<!-- SIGNUP FORM -->
<section class="signup-section">
  <div class="container">
    <form id="signupForm">
      <h2>Sign Up / Registrieren</h2>

      <label>Full Name / Vollständiger Name</label>
      <input type="text" name="fullname" required>

      <label>Email / E-Mail-Adresse</label>
      <input type="email" name="email" required>

      <label>Password / Passwort</label>
      <input type="password" name="password" required>

      <h3>Wie möchtest du diese Website nutzen?</h3>
      <label><input type="radio" name="usertype" value="Private" required> Private / Privat</label>
      <label><input type="radio" name="usertype" value="Business" required> Business / Gewerblich</label>

      <div id="profileNameField" class="hidden">
        <label>Profile Name (nur für Privatnutzer)</label>
        <input type="text" name="profilename">
      </div>

      <div id="businessFields" class="hidden">
        <label>Company Name / Firmenname</label>
        <input type="text" name="companyname">

        <label>Business Email / Geschäfts-E-Mail</label>
        <input type="email" name="businessemail">

        <label>Business Address / Geschäftsadresse</label>
        <input type="text" name="businessaddress">

        <label>VAT / Tax ID (optional)</label>
        <input type="text" name="taxid">

        <label>Company Website (optional)</label>
        <input type="url" name="companywebsite" placeholder="https://">
      </div>

      <div class="datenschutz">
        <input type="checkbox" required>
        <label>
          I agree that my information may be shared with third parties for job-related purposes.<br>
          Ich stimme zu, dass meine Daten zu Jobzwecken an Dritte weitergegeben werden dürfen.
        </label>
      </div>

      <button type="submit">Create Account / Konto Erstellen</button>

      <div id="thankYouMessage"></div>
      <div id="errorMessage"></div>
    </form>
  </div>
</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_NEW_API_KEY_HERE",
  authDomain: "job-board-da315.firebaseapp.com",
  projectId: "job-board-da315",
  storageBucket: "job-board-da315.appspot.com",
  messagingSenderId: "908048807079",
  appId: "1:908048807079:web:58f70af2e706f27684d782",
  measurementId: "G-FHYPY906DE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

const radioButtons = document.querySelectorAll('input[name="usertype"]');
const profileNameField = document.getElementById('profileNameField');
const businessFields = document.getElementById('businessFields');
const thankYouMessage = document.getElementById('thankYouMessage');
const errorMessage = document.getElementById('errorMessage');

radioButtons.forEach(radio => {
  radio.addEventListener('change', () => {
    if (radio.value === 'Private') {
      profileNameField.classList.remove('hidden');
      businessFields.classList.add('hidden');
      businessFields.querySelectorAll('input').forEach(el => el.required = false);
    } else {
      profileNameField.classList.add('hidden');
      businessFields.classList.remove('hidden');
      businessFields.querySelectorAll('input').forEach(el => {
        if (el.name !== 'taxid' && el.name !== 'companywebsite') el.required = true;
      });
    }
  });
});

document.getElementById('signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  errorMessage.style.display = "none";
  thankYouMessage.style.display = "none";

  const form = e.target;

  const userData = {
    fullname: form.fullname.value.trim(),
    email: form.email.value.trim(),
    usertype: form.usertype.value,
    profilename: form.profilename?.value.trim() || '',
    companyname: form.companyname?.value.trim() || '',
    businessemail: form.businessemail?.value.trim() || '',
    businessaddress: form.businessaddress?.value.trim() || '',
    taxid: form.taxid?.value.trim() || '',
    companywebsite: form.companywebsite?.value.trim() || '',
    createdAt: new Date().toISOString()
  };

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, userData.email, form.password.value);
    const user = userCredential.user;

    await setDoc(doc(db, "users", user.uid), userData);
    await sendEmailVerification(user);

    form.style.display = "none";
    thankYouMessage.innerHTML = `
      ✅ Thank you for creating an account!<br>
      Please verify your email before logging in.
    `;
    thankYouMessage.style.display = "block";

  } catch (error) {
    const messages = {
      "auth/email-already-in-use": "This email is already registered.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Password should be at least 6 characters."
    };
    errorMessage.textContent = messages[error.code] || error.message;
    errorMessage.style.display = "block";
  }
});
</script>

</body>
</html>
